meta:
  title: bscit.dev
  title_template: %s - bscit.dev
  author: bscit
  site_name: bscit
  robots: noarchive

site:
  origin: https://bscit.dev
  skip: [.vscode, "*.sh", .git, .versionbump, .build.sh]

rss:
  enabled: true
  title: bscit updates
  description: bscit's log of activities
  collection: log

design:
  inline_css: true

collections:
  writing:
    include: [site/writing/]
    require: [title, date]
    skip: [draft]
    sort: date desc
  log:
    include: [site/log/]
    skip: [draft]
    sort: slug desc
  recipes_meals:
    include: [site/recipes/meals/]
    require: [title]
    skip: [hide]
    sort: title
  recipes_sides:
    include: [site/recipes/sides/]
    require: [title]
    skip: [hide]
    sort: title
  recipes_desserts:
    include: [site/recipes/desserts/]
    require: [title]
    skip: [hide]
    sort: title
  recipes_all:
    include: [site/recipes/]
    require: [title]
    skip: [hide]
    sort: title

content:
  heading_ids: true
